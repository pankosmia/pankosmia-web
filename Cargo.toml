[package]
name = "pankosmia_web"
description = "A web server for pankosmia desktop applications"
version = "0.20.3"
edition = "2021"
license = "MIT"
homepage = "https://xenizo.fr"
repository = "https://github.com/pankosmia/pankosmia-web"
readme = "Crate_README.md"

exclude = [
    "webfonts/*"
]

[lib]
name = "pankosmia_web"
crate-type = [
    "lib"
]
path = "src/lib.rs"

[dependencies]
boon = "0.6.1"
chksum-md5 = "0.1.0"
chrono = "0.4.45"
copy_dir = "0.1.3"
ffmpeg-sidecar = "2.7.0"
git2 = "0.20.4"
home = "0.5.11"
mime-infer= "4.0.1"
md5 = "0.8.1"
regex = "1.13.1"
rocket = { version = "0.5.1", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = "1.53.3"
ureq = { version = "2.12.1", features = ["json"] }
uuid = {  version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
time = "0.3.55"
whoami = "1.6.1"
zip = "9.0.5"
tempfile = "3.27.0"
pankosmia_rag_chat = {version = "0.0.3"}
rten = { version = "0.24.0", features = ["all-ops", "mmap"] }
rten-generate = { version = "0.24.0", features=["text-decoder"] }
rten-text = { version = "0.24.0" }
json_value_merge = "2.0.1"
